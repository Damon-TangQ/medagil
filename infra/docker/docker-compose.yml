version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medagil_postgres
    environment:
      POSTGRES_DB: medagil
      POSTGRES_USER: medagil_user
      POSTGRES_PASSWORD: medagil_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medagil_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagil_user -d medagil"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: medagil_mongodb
    environment:
      MONGO_INITDB_DATABASE: medagil
      MONGO_INITDB_ROOT_USERNAME: medagil_user
      MONGO_INITDB_ROOT_PASSWORD: medagil_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medagil_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medagil_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medagil_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  medagil_network:
    driver: bridge