# Medagil api-service OpenAPI 基线
# 与 api-service 实现保持一致；可由 api-service 的 swag 生成后替换此文件
openapi: 3.0.3
info:
  title: Medagil API
  version: 0.1.0
  description: 用户端与管理端 REST API，路径与 tag 区分

servers:
  - url: ''
    description: 运行时由各 app 注入 baseUrl（如 process.env.NEXT_PUBLIC_API_URL）

paths:
  # ---------- 用户端 API (tag: user) ----------
  /api/v1/ping:
    get:
      tags: [user]
      summary: 用户端心跳
      operationId: getPing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/me:
    get:
      tags: [user]
      summary: 当前用户信息
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Unauthorized

  /api/v1/projects:
    get:
      tags: [user]
      summary: 项目列表
      operationId: getProjects
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }

  # ---------- 管理端 API (tag: admin) ----------
  /api/v1/admin/ping:
    get:
      tags: [admin]
      summary: 管理端心跳
      operationId: getAdminPing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/admin/dashboard/stats:
    get:
      tags: [admin]
      summary: 数据看板统计
      operationId: getDashboardStats
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表（管理端）
      operationId: getAdminUsers
      security: [{ adminBearer: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserProfile' } }
                  total: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户端 Token
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理端管理员 Token
  schemas:
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        plan: { type: string, enum: [free, pro, max] }
        credits: { type: integer, nullable: true }
    ProjectListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        total: { type: integer }
    ProjectSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    DashboardStats:
      type: object
      properties:
        totalUsers: { type: integer }
        totalOrders: { type: integer }
        mrr: { type: number }
